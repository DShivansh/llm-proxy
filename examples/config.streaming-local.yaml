server:
  host: 0.0.0.0
  port: 8000

database:
  url: sqlite:///./llm_proxy.streaming-local.db

tracing:
  log_full_body: true

quota:
  period: manual

providers:
  default: local

  local:
    type: openai_compatible
    default_model: llama3.2:3b
    base_url: http://localhost:11434/v1

models:
  llama3.2:3b:
    output_token_limit: 150
